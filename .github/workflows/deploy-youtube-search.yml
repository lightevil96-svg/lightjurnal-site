name: Deploy YouTube Search Proxy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/youtube-search/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-youtube-search.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      PROJECT_REF: wyxjubvpnshqthtnmbyl
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check required secrets
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing repository secret SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$YOUTUBE_API_KEY" || { echo "Missing repository secret YOUTUBE_API_KEY"; exit 1; }

      - name: Store Google API key in Supabase
        shell: bash
        run: supabase secrets set "YOUTUBE_API_KEY=$YOUTUBE_API_KEY" --project-ref "$PROJECT_REF"

      - name: Deploy Edge Function
        shell: bash
        run: supabase functions deploy youtube-search --project-ref "$PROJECT_REF" --no-verify-jwt
